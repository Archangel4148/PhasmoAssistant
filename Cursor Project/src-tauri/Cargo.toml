[package]
name = "phasmophobia-companion"
version = "0.1.0"
description = "Phasmophobia Companion & Overlay"
authors = ["Simon Edmunds"]
edition = "2021"

[lib]
name = "phasmophobia_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2.3.2"
